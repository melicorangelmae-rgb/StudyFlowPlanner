<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>StudyFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--surface:#0b111f;--raised:#101a30;--line:#1a2641;--line2:#2a3d68;--ink:#e9efff;--muted:#8a9bbd;
--accent:#2f6bff;--accent2:#4b82ff;--hi:#6a9bff;--hot:#ff4d5e;--warn:#f2a33a;--ok:#3aa6ff;
--bar:linear-gradient(180deg,#6a9bff,#2f6bff);--disp:"Bricolage Grotesque",Georgia,sans-serif;--body:Figtree,system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(800px 420px at 85% -10%,rgba(47,107,255,.2),transparent 65%),var(--bg);background-repeat:no-repeat;color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--disp);line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:24px 16px;border-right:1px solid var(--line);background:rgba(5,7,13,.6)}
.logo{padding:0 8px 24px;font:800 22px var(--disp)}
.logo span{margin-right:2px;padding:0 6px;background:var(--accent);color:#fff;border-radius:4px}
#nav{display:grid;gap:4px}
#nav button{padding:10px 12px;background:none;border:0;border-radius:10px;color:var(--muted);font-weight:600;text-align:left}
#nav button:hover{background:var(--raised);color:var(--ink)}
#nav button[aria-current=page]{background:var(--raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.main{min-width:0;max-width:1000px;width:100%;padding:28px 32px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.top h1{font-size:clamp(28px,4vw,36px);letter-spacing:-.02em}
.top p{color:var(--muted);font-size:14px}

/* Controls */
.btn{padding:10px 18px;background:var(--accent);color:#fff;border:0;border-radius:10px;font-weight:600;transition:background .15s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:none;border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--raised)}
.btn.sm{padding:5px 12px;font-size:14px}
label{display:block;margin:14px 0 6px;color:var(--muted);font-size:13px;font-weight:600}
input,select{width:100%;padding:10px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;font:inherit}
input:focus,select:focus{outline:0;border-color:var(--hi);box-shadow:0 0 0 3px rgba(106,155,255,.22)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards */
.card{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card h2{margin-bottom:14px;font-size:18px}
.meta{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stat{padding:16px 20px}.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:800 30px var(--disp)}.stat span{color:var(--muted);font-size:13px}
.empty{padding:28px;color:var(--muted);text-align:center;border:2px dashed var(--line);border-radius:12px}

/* Chart */
.week{position:relative;display:flex;align-items:flex-end;gap:10px;height:200px;border-bottom:2px solid var(--line2);background:linear-gradient(to top,var(--line) 1px,transparent 1px) 0 100%/100% 25%}
.col{position:relative;display:flex;align-items:flex-end;justify-content:center;flex:1;height:100%}
.bar{width:100%;height:var(--h,0%);min-height:2px;background:var(--bar);border-radius:8px 8px 0 0;transition:height .5s}
.bar.over{background:var(--hot)}
.col small{position:absolute;bottom:calc(var(--h,0%) + 4px);font-size:12px;font-weight:600}
.days{display:flex;gap:10px;margin-top:6px;color:var(--muted);font-size:13px}.days span{flex:1;text-align:center}
.limit{position:absolute;left:0;right:0;bottom:var(--at,0%);border-top:2px dashed var(--hot);opacity:.7;pointer-events:none}
.limit em{position:absolute;right:0;top:-20px;color:var(--hot);font-size:12px;font-style:normal;font-weight:600}
.note{margin-top:14px;font-weight:500}

/* Plan and tasks */
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plan b{font:700 17px var(--disp)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:99px;font-size:14px;font-weight:500}
.chip:hover{background:var(--raised)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:10px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:12px}
.task:hover{border-color:var(--line2)}
.task.high{border-left-color:var(--hot)}.task.med{border-left-color:var(--warn)}
.task.done{opacity:.55}.task.done h3{text-decoration:line-through}
.task input{width:22px;height:22px;accent-color:var(--accent)}
.task h3{font-size:17px;overflow-wrap:anywhere}
.due{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}.due.late{color:var(--hot)}
.del{display:block;margin:2px 0 0 auto;padding:0;background:none;border:0;color:var(--muted);font-size:13px}.del:hover{color:var(--hot)}
.prog{height:5px;margin-top:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog::after{content:"";display:block;width:var(--p,0%);height:100%;background:var(--accent)}

/* Focus */
.focus{max-width:420px;margin:0 auto;text-align:center}
.focus label,.focus .meta{text-align:left}
.clock{margin:18px 0;font:800 72px/1 var(--disp);font-variant-numeric:tabular-nums}
.focus .row .btn{width:100%}
#fnote{margin-top:14px;text-align:center!important}
.clock.rest{color:var(--ok)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#fSkip{width:100%;margin-top:10px}

/* New task dialog */
dialog{width:min(420px,calc(100% - 32px));padding:24px;background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:16px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{margin-bottom:4px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* Phones: sidebar becomes a bottom tab bar */
@media(max-width:760px){
.shell{display:block}
.side{position:fixed;inset:auto 0 0 0;z-index:5;height:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);background:rgba(8,12,22,.96);backdrop-filter:blur(10px)}
.logo{display:none}
#nav{grid-template-columns:repeat(3,1fr)}
#nav button{text-align:center;padding:10px 4px}
#nav button[aria-current=page]{box-shadow:inset 0 3px 0 var(--accent)}
.main{padding:calc(20px + env(safe-area-inset-top,0px)) 16px 96px}
.grid{grid-template-columns:1fr}
.stat{padding:12px 14px}
.task{grid-template-columns:auto minmax(0,1fr)}
.task>div:last-child{grid-column:2;display:flex;justify-content:space-between;align-items:center}
.due{text-align:left}.del{margin:0}
}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><span>Study</span>Flow</div>
    <nav id="nav" aria-label="Main">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="focus">Focus</button>
    </nav>
  </aside>

  <main class="main">
    <header class="top">
      <div><h1 id="title">Dashboard</h1><p id="date"></p></div>
      <button class="btn" id="newTask" type="button">+ New task</button>
    </header>

    <!-- Dashboard -->
    <section id="v-dashboard">
      <div class="stats">
        <div class="stat"><b id="sOpen">0</b><span>Open tasks</span></div>
        <div class="stat"><b id="sHours">0</b><span>Hours left</span></div>
        <div class="stat"><b id="sSoon">0</b><span>Due in 3 days</span></div>
      </div>
      <div class="grid">
        <div class="card">
          <h2>Next 7 days</h2>
          <div class="week" id="week" role="img" aria-label="Planned study hours">
            <div class="limit" id="limit"><em id="limitLabel"></em></div>
          </div>
          <div class="days" id="days" aria-hidden="true"></div>
          <p class="note" id="note" aria-live="polite"></p>
        </div>
        <div class="card"><h2>Today’s plan</h2><div id="today"></div></div>
      </div>
    </section>

    <!-- Tasks -->
    <section id="v-tasks" hidden>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="chip" data-f="open" aria-pressed="true" type="button">Open</button>
        <button class="chip" data-f="soon" aria-pressed="false" type="button">Due soon</button>
        <button class="chip" data-f="done" aria-pressed="false" type="button">Completed</button>
        <button class="chip" data-f="all" aria-pressed="false" type="button">All</button>
      </div>
      <div id="list"></div>
    </section>

    <!-- Focus -->
    <section id="v-focus" hidden>
      <div class="card focus">
        <label for="fTask">Studying</label>
        <select id="fTask"></select>
        <div class="row">
          <div><label for="fFocus">Focus (minutes)</label><input id="fFocus" type="number" min="1" max="180" step="1"></div>
          <div><label for="fRest">Rest (minutes)</label><input id="fRest" type="number" min="1" max="60" step="1"></div>
        </div>
        <div class="presets" role="group" aria-label="Presets">
          <button class="chip" data-p="25,5" type="button">25 / 5</button>
          <button class="chip" data-p="50,10" type="button">50 / 10</button>
          <button class="chip" data-p="90,15" type="button">90 / 15</button>
        </div>
        <div class="clock" id="clock" role="timer">25:00</div>
        <div class="row">
          <button class="btn" id="fStart" type="button">Start</button>
          <button class="btn ghost" id="fReset" type="button">Reset</button>
        </div>
        <button class="btn ghost" id="fSkip" type="button" hidden>Skip rest</button>
        <p class="meta" id="fnote">Focus session</p>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg">
  <form id="form" autocomplete="off">
    <h2>New task</h2>
    <label for="tTitle">Task</label>
    <input id="tTitle" required maxlength="80" placeholder="Chemistry lab report">
    <label for="tCourse">Course</label>
    <input id="tCourse" maxlength="40" placeholder="CHEM 201">
    <div class="row">
      <div><label for="tDue">Due date</label><input id="tDue" type="date" required></div>
      <div><label for="tHours">Hours needed</label><input id="tHours" type="number" min="0.5" max="100" step="0.5" value="3" required></div>
    </div>
    <label for="tPrio">Priority</label>
    <select id="tPrio"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select>
    <div class="actions">
      <button class="btn ghost" id="cancel" type="button">Cancel</button>
      <button class="btn" type="submit">Add task</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  const KEY = 'studyflow-tasks', LIMIT = 6, SOON = 3, TIMER_KEY = 'studyflow-timer';
  const PRIO = ['high', 'med', 'low'], VIEWS = ['dashboard', 'tasks', 'focus'];
  const BASE_TITLE = document.title;
  let tasks = [], filter = 'open';
  const $ = (id) => document.getElementById(id);
  const dayName = new Intl.DateTimeFormat(undefined, { weekday: 'short' });

  /* Dates: whole calendar days, safe across daylight saving */
  const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const daysLeft = (t) => { const [y, m, d] = t.due.split('-').map(Number), n = today();
    return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())) / 864e5); };
  const dueText = (n) => n < 0 ? Math.abs(n) + (n === -1 ? ' day' : ' days') + ' overdue' : n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : 'Due in ' + n + ' days';
  const fh = (h) => String(Math.round(h * 10) / 10);
  const left = (t) => Math.max(t.hours - t.spent, 0);
  const byDue = (a, b) => a.due.localeCompare(b.due);
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }

  /* Storage */
  const valid = (t) => t && typeof t.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.due) && Number.isFinite(t.hours) && PRIO.includes(t.prio);
  const norm = (t) => { t.spent = Math.max(Number(t.spent) || 0, 0); return t; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };
  function load() {
    try { const p = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(p)) { tasks = p.filter(valid).map(norm); return; } } catch (e) {}
    const s = (id, title, course, d, hours, prio) => ({ id, title, course, due: iso(addDays(today(), d)), hours, prio, done: false, spent: 0 });
    tasks = [s(1, 'Statistics problem set', 'MATH 210', 1, 4, 'high'), s(2, 'History essay draft', 'HIST 105', 3, 8, 'med'),
             s(3, 'Midterm exam revision', 'BIO 120', 5, 10, 'high'), s(4, 'Reading response', 'ENG 101', 6, 2, 'low')];
  }

  /* Dashboard */
  function renderDashboard() {
    const open = tasks.filter((t) => !t.done);
    $('sOpen').textContent = open.length;
    $('sHours').textContent = fh(open.reduce((s, t) => s + left(t), 0));
    $('sSoon').textContent = open.filter((t) => daysLeft(t) <= SOON).length;

    const load = new Array(7).fill(0);
    open.forEach((t) => { const span = Math.max(daysLeft(t), 0) + 1;
      for (let i = 0; i < span && i < 7; i++) load[i] += left(t) / span; });
    const max = Math.max(8, Math.ceil(Math.max(...load)));
    const week = $('week'), days = $('days'), start = today();
    week.querySelectorAll('.col').forEach((c) => c.remove());
    days.textContent = '';
    let over = 0;
    load.forEach((h, i) => {
      if (h > LIMIT) over++;
      const col = el('div', 'col');
      col.style.setProperty('--h', h / max * 100 + '%');
      col.append(el('div', 'bar' + (h > LIMIT ? ' over' : '')), el('small', '', h > 0 ? fh(h) + 'h' : ''));
      week.appendChild(col);
      days.appendChild(el('span', '', i === 0 ? 'Today' : dayName.format(addDays(start, i))));
    });
    $('limitLabel').textContent = LIMIT + ' h limit';
    $('limit').style.setProperty('--at', LIMIT / max * 100 + '%');
    $('note').textContent = over ? over + (over > 1 ? ' days are' : ' day is') + ' over ' + LIMIT + ' hours. Try starting some tasks earlier.'
      : open.length ? 'Your week looks manageable.' : 'Nothing planned. Add a task to get started.';
    week.setAttribute('aria-label', 'Planned study hours: ' + load.map((h, i) => (i ? dayName.format(addDays(start, i)) : 'today') + ' ' + fh(h) + ' hours').join(', '));

    const box = $('today'), items = open.filter((t) => left(t) > 0).sort(byDue);
    box.textContent = '';
    if (!items.length) { box.appendChild(el('div', 'empty', 'Nothing to study today. Add a task to build your plan.')); return; }
    const total = items.reduce((s, t) => s + left(t) / (Math.max(daysLeft(t), 0) + 1), 0);
    box.appendChild(el('p', 'meta', fh(total) + ' h planned today' + (total > LIMIT ? ', over your ' + LIMIT + ' h limit' : '')));
    items.forEach((t) => {
      const row = el('div', 'plan'), info = el('div');
      info.append(el('strong', '', t.title), el('div', 'meta', (t.course ? t.course + ' · ' : '') + dueText(daysLeft(t))));
      const b = el('button', 'btn ghost sm', 'Focus'); b.type = 'button'; b.dataset.focus = t.id;
      row.append(info, el('b', '', fh(left(t) / (Math.max(daysLeft(t), 0) + 1)) + ' h'), b);
      box.appendChild(row);
    });
  }

  /* Tasks */
  const shows = (t) => filter === 'all' || (filter === 'open' && !t.done) || (filter === 'done' && t.done) || (filter === 'soon' && !t.done && daysLeft(t) <= SOON);
  function renderTasks() {
    const list = $('list'), shown = tasks.filter(shows).sort(byDue);
    list.textContent = '';
    if (!shown.length) { list.appendChild(el('div', 'empty', filter === 'done' ? 'No completed tasks yet.' : 'No tasks here. Tap “New task” to add one.')); return; }
    shown.forEach((t) => {
      const n = daysLeft(t), row = el('div', 'task ' + t.prio + (t.done ? ' done' : ''));
      const box = el('input'); box.type = 'checkbox'; box.checked = t.done; box.dataset.id = t.id;
      box.setAttribute('aria-label', 'Mark "' + t.title + '" complete');
      const info = el('div'), prog = el('div', 'prog');
      prog.style.setProperty('--p', Math.min(t.spent / t.hours, 1) * 100 + '%');
      info.append(el('h3', '', t.title), el('div', 'meta', (t.course ? t.course + ' · ' : '') + fh(t.spent) + ' / ' + fh(t.hours) + ' h done'), prog);
      const side = el('div'), del = el('button', 'del', 'Delete');
      del.type = 'button'; del.dataset.del = t.id; del.setAttribute('aria-label', 'Delete "' + t.title + '"');
      side.append(el('div', 'due' + (n < 0 && !t.done ? ' late' : ''), dueText(n)), del);
      row.append(box, info, side);
      list.appendChild(row);
    });
  }

  /* Focus timer: uses an end timestamp so background tabs stay accurate */
  const num = (v, lo, hi, d) => { v = Math.round(Number(v)); return v >= lo && v <= hi ? v : d; };
  let focusMin = 25, restMin = 5;
  try { const c = JSON.parse(localStorage.getItem(TIMER_KEY)); if (c) { focusMin = num(c.f, 1, 180, 25); restMin = num(c.r, 1, 60, 5); } } catch (e) {}
  const timer = { mode: 'focus', len: focusMin, ms: focusMin * 6e4, end: 0, id: null };
  function setMode(mode) { timer.mode = mode; timer.len = mode === 'focus' ? focusMin : restMin; timer.ms = timer.len * 6e4; }
  function applyCfg(f, r) {
    focusMin = num(f, 1, 180, focusMin); restMin = num(r, 1, 60, restMin);
    $('fFocus').value = focusMin; $('fRest').value = restMin;
    try { localStorage.setItem(TIMER_KEY, JSON.stringify({ f: focusMin, r: restMin })); } catch (e) {}
    if (!timer.id) setMode(timer.mode);
    draw();
  }
  const clock = (ms) => { const s = Math.max(Math.ceil(ms / 1000), 0); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  function draw(note) {
    $('clock').textContent = clock(timer.ms);
    $('fStart').textContent = timer.id ? 'Pause' : 'Start';
    $('fnote').textContent = note || (timer.mode === 'focus' ? 'Focus · ' + timer.len + ' min' : 'Rest · ' + timer.len + ' min');
    $('clock').classList.toggle('rest', timer.mode === 'break');
    $('fSkip').hidden = timer.mode !== 'break';
    $('fFocus').disabled = $('fRest').disabled = Boolean(timer.id);
    document.title = timer.id ? clock(timer.ms) + ' · StudyFlow' : BASE_TITLE;
  }
  function renderSelect() {
    const sel = $('fTask'), prev = sel.value, open = tasks.filter((t) => !t.done).sort(byDue);
    sel.textContent = '';
    if (!open.length) { const o = el('option', '', 'No open tasks'); o.value = ''; sel.appendChild(o); return; }
    open.forEach((t) => { const o = el('option', '', t.title); o.value = t.id; sel.appendChild(o); });
    if (open.some((t) => String(t.id) === prev)) sel.value = prev;
  }
  const stop = () => { clearInterval(timer.id); timer.id = null; };
  function finish() {
    stop();
    let note;
    if (timer.mode === 'focus') {
      const t = tasks.find((x) => String(x.id) === $('fTask').value);
      const done = timer.len;
      if (t) { t.spent += done / 60; save(); render(); note = done + ' min logged to "' + t.title + '". Rest for ' + restMin + ' min.'; }
      else note = 'Session done. Pick a task next time to log it. Rest for ' + restMin + ' min.';
      setMode('break');
    } else { setMode('focus'); note = 'Rest is over. Ready for the next session?'; }
    draw(note);
  }
  function toggle() {
    if (timer.id) { timer.ms = timer.end - Date.now(); stop(); }
    else { timer.end = Date.now() + timer.ms; timer.id = setInterval(() => { timer.ms = timer.end - Date.now(); timer.ms <= 0 ? finish() : draw(); }, 250); }
    draw();
  }
  function reset() { stop(); setMode('focus'); draw(); }

  /* Views */
  function show(view) {
    if (!VIEWS.includes(view)) view = 'dashboard';
    VIEWS.forEach((v) => {
      $('v-' + v).hidden = v !== view;
      const b = document.querySelector('#nav [data-view="' + v + '"]');
      if (v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('title').textContent = view[0].toUpperCase() + view.slice(1);
    if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
    window.scrollTo(0, 0);
  }
  function render() { renderDashboard(); renderTasks(); renderSelect(); }

  /* Events */
  function openDialog() { $('form').reset(); $('tDue').min = iso(today()); $('tDue').value = iso(addDays(today(), 1)); $('dlg').showModal(); $('tTitle').focus(); }
  $('newTask').addEventListener('click', openDialog);
  $('cancel').addEventListener('click', () => $('dlg').close());
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = (id) => $(id).value.trim(), title = v('tTitle');
    if (!title) return;
    tasks.push({ id: Date.now(), title, course: v('tCourse'), due: v('tDue'), hours: parseFloat(v('tHours')) || 1, spent: 0, prio: PRIO.includes(v('tPrio')) ? v('tPrio') : 'med', done: false });
    save(); render(); $('dlg').close();
  });
  $('nav').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) show(b.dataset.view); });
  $('list').addEventListener('change', (e) => {
    const b = e.target.closest('input[data-id]'); if (!b) return;
    const t = tasks.find((x) => String(x.id) === b.dataset.id); if (t) t.done = b.checked;
    save(); render();
  });
  $('list').addEventListener('click', (e) => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    tasks = tasks.filter((t) => String(t.id) !== b.dataset.del); save(); render();
  });
  document.querySelector('.filters').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    filter = c.dataset.f;
    document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
    renderTasks();
  });
  $('today').addEventListener('click', (e) => {
    const b = e.target.closest('[data-focus]'); if (!b) return;
    show('focus'); $('fTask').value = b.dataset.focus;
  });
  $('fStart').addEventListener('click', toggle);
  $('fReset').addEventListener('click', reset);
  $('fSkip').addEventListener('click', () => { stop(); setMode('focus'); draw(); });
  ['fFocus', 'fRest'].forEach((id) => $(id).addEventListener('change', () => applyCfg($('fFocus').value, $('fRest').value)));
  document.querySelector('.presets').addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b || timer.id) return;
    const [f, r] = b.dataset.p.split(','); applyCfg(f, r);
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));

  /* Start */
  $('date').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
  load(); render(); $('fFocus').value = focusMin; $('fRest').value = restMin; draw(); show(location.hash.slice(1));
})();
</script>
</body>
</html>
